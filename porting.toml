schema_version = 1

[device]
name = "orangepi5"
soc = "RK3588"
os_profile = "ipados-17.7.11-21H461"
summary = "Orange Pi 5 (Rockchip RK3588S) with an HDMI display and an M.2 NVMe drive, planned to run the iPadOS 17.7.11 userland on a source-built XNU, started from edk2-rk3588 firmware (uefi-orangepi5). Shared SoC support is in UniXNU-rk3588-common, which the EVB10 port already proved on hardware. Nothing in this repository has run on an Orange Pi 5 yet: the configuration resolves and the console kernel builds on the host, every area below records what is still to be measured."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", ".env.example", "local.toml.example", "unixnu.lock", "LICENSE", ".gitattributes", "scripts/build-orangepi5-kernel.sh"]
inputs = ["ARM64 profile, rk3588 SoC source pinned in feeds.toml, iPadOS 17.7.11 build 21H461 profile, orangepi5_defconfig."]
configuration = ["board.soc_source = rk3588; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "orangepi5_defconfig keeps the console kernel: no display, no GPU, no RAM disk, no UFS; the trust-cache runtime and the code-signing hash cache stay on.", "[adt.defaults.u32] carries sleep-disabled = 1 and vmm-present = 1, which the EVB10 port found necessary for watchdogd."]
procedure = ["From the UniXNU checkout run ./unixnu defconfig orangepi5_defconfig -D ../UniXNU-orangepi5, then ./unixnu fetch, ./unixnu status --json and ./unixnu tree with the same -D.", "scripts/build-orangepi5-kernel.sh runs the kernel build; it needs the environment of the machine that builds (.env) and CMake 3.19.6 or newer."]
findings = ["Resolution is host-verified: defconfig, fetch, status --json and tree complete against the pinned SoC repository.", "The UniXNU bootstrap pass builds AvailabilityVersions with CMake; the distribution CMake of Ubuntu 20.04 is 3.16 and fails, so the build script puts /usr/local/bin first."]
completion = ["Every source pin resolves, ./unixnu status lists the intended patch order, and the defconfig materialises."]
limits = ["The kernel configuration is the console minimum; storage, display, GPU and input join it as those drivers exist (docs/bring-up.md)."]
next_action = ["Add the NVMe driver archive and the display archive to board.toml when the drivers exist."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Board configuration of the console kernel"

[[area.evidence]]
kind = "host"
reference = "evidence/host-kernel-build-20261101.txt"
result = "defconfig, fetch, status, tree and the full console kernel build complete on the host; nothing ran on the board"
command = "source host/env.sh && cd UniXNU-orangepi5 && scripts/build-orangepi5-kernel.sh"
revision = "f4bb6e952e915f4f837547f11981ca26b61a5c46"

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["docs/bring-up.md"]
inputs = ["edk2-rk3588 firmware built by uefi-orangepi5 (an SPI NOR image with TF-A at EL3, OP-TEE and the UEFI volume), UEFI GOP frame buffer on HDMI0."]
configuration = ["board.toml has no [firmware] section: the unixnu firmware step builds Mu-Silicium, and this board boots edk2-rk3588 built by uefi-orangepi5.", "payload.loader = firmware: DarwinBoot is inside the firmware volume and reads the payload from the ESP of the NVMe drive, found through NvmExpressDxe."]
procedure = ["Build the firmware in uefi-orangepi5 (build.sh); the SPI NOR image is written to the board's flash by a method that needs the board and is not recorded yet."]
findings = ["The firmware builds on the host with the GPU rail set to 0.75 V and the hardware watchdog driver of uefi-orangepi5 armed (the board has no remote power switch, so a hung kernel must end in a watchdog reset).", "Not yet observed on the board: the UEFI banner, the DRAM size, the PCIe link of the NVMe drive and the GOP resolution."]
completion = ["Firmware enters DarwinBoot, publishes the GOP frame buffer and finds the NVMe ESP."]
limits = ["No hardware access so far: serial console, flashing method and the board's RAM size are open inputs."]
next_action = ["Connect the board (UART2 at 1.5 Mbaud, HDMI, NVMe), write the NOR image and record the first firmware log."]

[[area.evidence]]
kind = "source"
reference = "docs/bring-up.md"
result = "Boot flow and milestones M0 to M4"

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["scripts/*armcpu*"]
inputs = ["Four Cortex-A55 and four Cortex-A76 at affinities 0x000 to 0x700, GICv3 at 0xfe600000, 24 MHz architected timer, PSCI over SMC: the same cluster layout and GIC as the EVB10, since the RK3588S is the RK3588 without some interfaces."]
configuration = ["The CPU, GIC and PSCI nodes come from the SoC dtsi (rk3588-common dts/rk3588.dtsi); the board DTS enables nothing extra.", "Kernel arguments sheng-smp=1, armcpu-self-ipi=1, armcpu-mmio-sgi=0 and cpumask=31 are the ones of the EVB10 port."]
procedure = ["Compile dts/orangepi5.dts through ./unixnu tree and inspect /cpus, /psci and /arm-io/intc in the generated device tree.", "Boot and read the per-core entry lines on the serial console."]
findings = ["The CPU path is shared with the EVB10 and unchanged here; the EVB10 record documents the EL2 to EL1 drop of secondary cores and the Darwin assembler caveat.", "Whether the Orange Pi 5 firmware leaves the same state is not yet observed."]
completion = ["Every enabled core reaches its entry checkpoint and receives timer and inter-processor interrupts."]
limits = ["No CPU frequency governor yet; the DVFS rail table of the EVB10 (RK8602 at I2C0 0x42 and 0x43, RK806 BUCK1 and BUCK2) matches the Orange Pi 5 and will be reused with the power area."]
next_action = ["Boot the console kernel and compare the per-core lines with the EVB10 log."]

[[area.evidence]]
kind = "source"
reference = "dts/orangepi5.dts"
result = "Board device tree on top of the shared SoC description"

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/orangepi5.dts"]
inputs = ["Orange Pi 5 with 4, 8, 16 or 32 GiB of LPDDR4x; the RK3588 maps DRAM in two banks (below 0xf0000000 and from 0x100000000) around the peripheral window and the reserved regions of the firmware."]
configuration = ["The memory node and payload.dram_size are placeholders for 4 GiB at 0x100000000; payload.adt.owned_memory_size = 0x80000000 takes 2 GiB from the UEFI memory map."]
procedure = ["Read the memory map from the firmware log of the first run and replace both placeholders; keep the kernel's 2 GiB inside the bank the firmware reports as conventional memory."]
findings = ["Not yet measured. The EVB10 port found that DarwinBoot takes contiguous memory from the UEFI memory map and that the shared-region and DRAM-carve-out sizes must agree with the ADT."]
completion = ["The kernel reports the memory it owns and the ADT memory ranges match the firmware map."]
limits = ["The RAM size of the user's board is unknown."]
next_action = ["Capture the UEFI memory map on the board."]

[[area.evidence]]
kind = "source"
reference = "dts/orangepi5.dts"
result = "Placeholder memory node"

[[area]]
id = "storage"
status = "planned"
components = ["AppleKeyStoreState"]
paths = ["package/Rk3588Nvme/**"]
inputs = ["M.2 M-key slot on PCIe 2.0 x1 (pcie2x1l2 through combphy0_ps, reset GPIO3_D1, 3.3 V enable GPIO0_PC5), an NVMe drive for the ESP, the root image and the Data volume; the eMMC socket (dwcmshc, the controller of the EVB10 eMMC) and the microSD slot are left unused."]
configuration = ["board.toml [userdata] describes a proposed layout: an ESP of 512 MiB at LBA 2048 and a 64 GiB userdata partition at LBA 1050624, with the OS and SystemOS windows. No drive has been written."]
procedure = ["Write GPT, ESP (payload) and userdata to the drive with the board tools of uefi-orangepi5 once they exist; the NVMe block driver publishes the OS and SystemOS windows read-only and the Data window writable."]
findings = ["The EVB10 eMMC driver (Rk3588Emmc) is the model for the NVMe driver: a polled admin queue and one I/O queue, windows declared in the root manifest, writes only inside the Data window.", "No driver exists yet; the PCIe controller and link state left by the firmware are not observed."]
completion = ["The kernel mounts the root and Data volumes from the NVMe drive and launchd starts."]
limits = ["Largest piece of work of this port; needs the board and a drive of known size."]
next_action = ["Read the PCIe controller state and the NVMe controller registers from the firmware on the board, then write the driver."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Proposed userdata layout and storage-related configuration"

[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/OrangePi5Display/**"]
inputs = ["HDMI0 from VOP2 video port 0 (the EVB10 drives a panel through video port 2), UEFI GOP frame buffer, monitor mode chosen by EDID."]
configuration = ["The first milestone uses the GOP frame buffer DarwinBoot publishes (component GopFramebuffer, offline-legacy-gop=1); a VOP2 scanout driver on the Esmart window of video port 0 follows for frame rate."]
procedure = ["Boot the kernel with the GOP frame buffer and look at the monitor; then adapt the EVB10 VOP2 code to video port 0 and the monitor timing."]
findings = ["The EVB10 VOP2 constants (evb10-vop, evb10-fb-w, evb10-fb-h, video port, window) are board specific; the Orange Pi 5 needs its own values."]
completion = ["The kernel draws the boot screen on the HDMI monitor and SpringBoard appears."]
limits = ["Not started; needs the board and a monitor."]
next_action = ["Record the GOP mode and the VOP2 state left by the firmware."]

