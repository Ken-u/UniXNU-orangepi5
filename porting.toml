[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot", "SoftwareAES"]
paths = ["patches/**", "package/**"]
inputs = ["Console kernel from orangepi5_defconfig, trust caches and unixnu.toml of the payload, the 256 MiB OPI5ESP payload volume that goes on the NVMe ESP."]
configuration = ["payload.loader = firmware: the loader is part of the firmware volume of uefi-orangepi5, so the payload carries no loader image."]
procedure = ["unixnu build kernel, then unixnu build payload; copy the payload to the ESP of the NVMe drive."]
findings = ["The SoC patch rk3588-root-trust.patch makes bsd_init.c call native_emmc_root_trusted, which only the EVB10 eMMC driver defines, so the first link of the console kernel failed with an undefined symbol until the weak stub patch was added.", "The console kernel builds on the host; the payload has not been assembled because the ADT placeholders (RAM size) are open.", "The SoC repository is pinned in feeds.toml; local.toml can point at a checkout during development."]
completion = ["The payload boots from the NVMe ESP through the firmware and reaches the kernel entry."]
limits = ["One board patch so far (patches/xnu/orangepi5-root-trust-stub.patch): a weak native_emmc_root_trusted that answers no, because the SoC patch rk3588-root-trust.patch references the storage driver of the EVB10; the NVMe driver replaces it."]
next_action = ["Assemble the payload once the memory map is known."]

